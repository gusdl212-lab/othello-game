<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚫⚪ 멀티 오셀로 대전 플랫폼 (v2.5)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
        body {
            margin: 0; padding: 15px; background: #0b0c10; color: #e0e6ed;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 900px; background: #1f2833; border-radius: 16px;
            padding: 20px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); border: 1px solid #45a29e;
            position: relative;
        }
        h1 { text-align: center; color: #66fcf1; margin-top: 0; margin-bottom: 5px; font-size: 24px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #4eacc5; margin-bottom: 15px; background: #121821; padding: 6px 12px; border-radius: 6px; border: 1px solid #2d3748; }
        .card { background: #0b0c10; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2d3748; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #45a29e;
            background: #1f2833; color: #fff; font-size: 14px; outline: none; margin-bottom: 10px;
        }
        button {
            padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; transition: 0.2s; font-size: 13px; width: 100%;
        }
        .btn-blue { background: #2b6cb0; color: #fff; }
        .btn-blue:hover { background: #3182ce; }
        .btn-red { background: #c53030; color: #fff; }
        .btn-red:hover { background: #e53e3e; }
        .btn-main { background: #66fcf1; color: #0b0c10; font-size: 14px; font-weight: 800; }
        .btn-main:hover { background: #45a29e; }
        .btn-danger { background: #e53e3e; color: #fff; padding: 5px 10px; font-size: 11px; width: auto; }
        .lobby-grid { display: grid; grid-template-columns: 260px 1fr 240px; gap: 15px; }
        .panel { background: #121821; border-radius: 10px; padding: 12px; border: 1px solid #2d3748; height: 460px; overflow-y: auto; }
        .panel h3 { font-size: 14px; color: #66fcf1; margin-top: 0; border-bottom: 1px solid #2d3748; padding-bottom: 8px; }
        .rank-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid #1f2833; align-items: center; }
        .rank-admin { color: #ffd700; font-weight: bold; }
        .user-list, .chat-messages { list-style: none; padding: 0; margin: 0; font-size: 12px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; background: #1f2833; margin-bottom: 4px; border-radius: 4px; }
        .chat-msg { margin-bottom: 6px; word-break: break-all; }
        .chat-msg span.sender { color: #66fcf1; font-weight: bold; }
        .room-list-box { max-height: 360px; overflow-y: auto; }
        .room-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: #1f2833; border-radius: 8px; margin-bottom: 8px; border: 1px solid #2d3748;
        }
        .game-layout { display: grid; grid-template-columns: 1fr 260px; gap: 15px; }
        .board-wrapper { position: relative; max-width: 380px; margin: 0 auto; width: 100%; }
        .othello-board {
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            gap: 3px; width: 100%; aspect-ratio: 1; background: #1b4332;
            padding: 6px; border-radius: 10px; border: 3px solid #2d6a4f;
        }
        .cell {
            background: #2d6a4f; border-radius: 3px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .cell:hover { background: #40916c; }
        .disc { width: 80%; height: 80%; border-radius: 50%; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        .disc.blue { background: #3182ce; border: 2px solid #63b3ed; }
        .disc.red { background: #e53e3e; border: 2px solid #feb2b2; }
        .hidden { display: none !important; }
        .auth-box { max-width: 380px; margin: 0 auto; }
    </style>
</head>
<body style="visibility: hidden;">

<div class="container">
    <h1>⚫⚪ 멀티 오셀로 대전 플랫폼</h1>
    <div class="status-bar">
        <span>🌐 파이어베이스 실시간 영구 연동 모드 (랭킹 복구완료)</span>
        <span style="color: #66fcf1; font-weight: bold;">현재 버전: v2.5</span>
    </div>

    <!-- 로그인 화면 -->
    <div id="view-auth" class="card auth-box hidden">
        <div id="form-login">
            <h3 style="text-align:center; color:#66fcf1;">🔐 로그인</h3>
            <input type="text" id="login-id" placeholder="아이디를 입력하세요" maxlength="20">
            <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" maxlength="20">
            <button class="btn-main" onclick="handleLogin()">로그인 🚀</button>
        </div>
    </div>

    <!-- 로비 화면 -->
    <div id="view-lobby" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div>[오셀로 로비] 환영합니다, <strong id="my-profile-name"></strong>님</div>
            <button class="btn-danger" onclick="handleLogout()">로그아웃 🚪</button>
        </div>
        <div class="lobby-grid">
            <div class="panel">
                <h3>🏆 실시간 단수 랭킹</h3>
                <div id="ranking-list">불러오는 중...</div>
            </div>
            <div class="panel" style="background:#1f2833;">
                <h3 style="display:flex; justify-content:space-between; align-items:center;">
                    <span>🚪 게임 방 목록</span>
                    <button class="btn-main" style="width:auto; padding:4px 8px; font-size:11px;" onclick="createRoom()">방 만들기 +</button>
                </h3>
                <div class="room-list-box" id="room-list-box">
                    <div style="text-align: center; color: #888; padding: 20px;">개설된 방이 없습니다.</div>
                </div>
            </div>
            <div class="panel" style="display:flex; flex-direction:column;">
                <h3>🟢 접속자 (<span id="online-count">0</span>명)</h3>
                <ul class="user-list" id="online-user-list" style="max-height:120px; overflow-y:auto; margin-bottom:10px;"></ul>
                <h3 style="margin-top:0;">💬 로비 채팅</h3>
                <ul class="chat-messages" id="lobby-chat-msgs" style="flex:1; overflow-y:auto; margin-bottom:8px;"></ul>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="lobby-chat-input" placeholder="메시지 입력" style="margin-bottom:0;" onkeypress="if(event.key==='Enter') sendLobbyChat()">
                    <button class="btn-blue" style="width:auto; padding:6px 10px;" onclick="sendLobbyChat()">전송</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 방 대기실 -->
    <div id="view-room" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>🏠 방 이름: <span id="display-room-id" style="color:#66fcf1;"></span></h3>
            <button class="btn-danger" style="width:auto;" onclick="leaveRoom()">방 나가기 🚪</button>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:15px;">
            <div style="background:#121821; padding:15px; border-radius:8px; border-top:4px solid #3182ce;">
                <div style="color:#63b3ed; font-weight:bold;">🔵 파란팀</div>
                <ul class="user-list" id="room-list-blue" style="margin-top:10px;"></ul>
                <button class="btn-blue" style="margin-top:10px;" onclick="selectTeam('blue')">파란팀 참가</button>
            </div>
            <div style="background:#121821; padding:15px; border-radius:8px; border-top:4px solid #e53e3e;">
                <div style="color:#feb2b2; font-weight:bold;">🔴 빨간팀</div>
                <ul class="user-list" id="room-list-red" style="margin-top:10px;"></ul>
                <button class="btn-red" style="margin-top:10px;" onclick="selectTeam('red')">빨간팀 참가</button>
            </div>
        </div>
        <div id="room-host-controls" style="margin-top: 15px; text-align: center;" class="hidden">
            <button class="btn-main" style="padding: 10px; width: 200px;" onclick="startGame()">🎲 게임 시작하기!</button>
        </div>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="view-game" class="card hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div style="font-size: 14px; font-weight: bold; color: #66fcf1;">🎮 오셀로 대국 중</div>
            <button class="btn-danger" style="width:auto;" onclick="leaveRoom()">나가기 🚪</button>
        </div>
        <div class="game-layout">
            <div>
                <div class="board-wrapper">
                    <div class="othello-board" id="othello-board"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_BASE_URL = "https://andy-5cb5e-default-rtdb.firebaseio.com/othello_platform";
    const ADMIN_ID = "andy212";
    let currentUser = null;
    let currentRoomId = null;
    let globalData = { users: {}, rooms: {}, lobbyChat: [] };
    let syncInterval = null;

    window.addEventListener('DOMContentLoaded', async () => {
        let sessionUser = localStorage.getItem('othello_session_user');
        if (sessionUser) {
            await fetchSystemData();
            currentUser = globalData.users[sessionUser] || { id: sessionUser, score: 0 };
            document.getElementById('my-profile-name').innerText = currentUser.id;
            switchView('view-lobby');
            startMainSync();
        } else {
            switchView('view-auth');
        }
        document.body.style.visibility = 'visible';
    });

    async function fetchSystemData() {
        try {
            let res = await fetch(`${FIREBASE_BASE_URL}.json`);
            if (res.ok) {
                let data = await res.json();
                if (data) {
                    globalData.users = data.users || {};
                    globalData.rooms = data.rooms || {};
                    globalData.lobbyChat = data.lobbyChat || [];
                }
            }
        } catch (e) { console.error(e); }
        
        if (currentRoomId && (!globalData.rooms || !globalData.rooms[currentRoomId])) {
            currentRoomId = null;
            switchView('view-lobby');
        }
        if (currentUser) renderLobbyView();
    }

    async function saveSpecificData(path, data) {
        await fetch(`${FIREBASE_BASE_URL}/${path}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
    }

    async function handleLogin() {
        let id = document.getElementById('login-id').value.trim();
        if (!id) return alert("아이디를 입력하세요.");
        await fetchSystemData();
        if (!globalData.users[id]) {
            globalData.users[id] = { id: id, score: 0 };
            await saveSpecificData('users/' + id, globalData.users[id]);
        }
        currentUser = globalData.users[id];
        localStorage.setItem('othello_session_user', id);
        document.getElementById('my-profile-name').innerText = id;
        switchView('view-lobby');
        startMainSync();
    }

    function handleLogout() {
        localStorage.removeItem('othello_session_user');
        currentUser = null;
        currentRoomId = null;
        switchView('view-auth');
    }

    function switchView(viewId) {
        document.getElementById('view-auth').classList.add('hidden');
        document.getElementById('view-lobby').classList.add('hidden');
        document.getElementById('view-room').classList.add('hidden');
        document.getElementById('view-game').classList.add('hidden');
        document.getElementById(viewId).classList.remove('hidden');
    }

    function startMainSync() {
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(fetchSystemData, 3000);
    }

    async function createRoom() {
        let roomName = prompt("방 이름을 입력하세요:", `${currentUser.id}의 방`);
        if (!roomName) return;
        roomName = roomName.trim();
        
        await fetchSystemData();
        if (globalData.rooms[roomName]) return alert("이미 존재하는 방입니다.");

        let newRoom = {
            id: roomName,
            hostId: currentUser.id,
            status: 'waiting',
            turn: 'blue',
            board: Array(8).fill(null).map(() => Array(8).fill(null)),
            players: {}
        };
        newRoom.board[3][3] = 'red'; newRoom.board[4][4] = 'red';
        newRoom.board[3][4] = 'blue'; newRoom.board[4][3] = 'blue';
        newRoom.players[currentUser.id] = { id: currentUser.id, team: 'blue' };

        await saveSpecificData('rooms/' + roomName, newRoom);
        currentRoomId = roomName;
        renderRoomOrGameView();
    }

    async function joinRoom(roomName) {
        currentRoomId = roomName;
        await fetchSystemData();
        let room = globalData.rooms[roomName];
        if (room && room.status === 'waiting' && !room.players[currentUser.id]) {
            room.players[currentUser.id] = { id: currentUser.id, team: 'red' };
            await saveSpecificData('rooms/' + roomName, room);
        }
        renderRoomOrGameView();
    }

    async function leaveRoom() {
        if (!currentRoomId) return;
        await fetchSystemData();
        let room = globalData.rooms[currentRoomId];
        if (room && room.players) {
            delete room.players[currentUser.id];
            if (Object.keys(room.players).length === 0) {
                await fetch(`${FIREBASE_BASE_URL}/rooms/${currentRoomId}.json`, { method: 'DELETE' });
            } else {
                await saveSpecificData('rooms/' + currentRoomId, room);
            }
        }
        currentRoomId = null;
        switchView('view-lobby');
        fetchSystemData();
    }

    async function selectTeam(team) {
        if (!currentRoomId) return;
        let room = globalData.rooms[currentRoomId];
        if (room && room.players[currentUser.id]) {
            room.players[currentUser.id].team = team;
            await saveSpecificData('rooms/' + currentRoomId, room);
            fetchSystemData();
        }
    }

    async function startGame() {
        let room = globalData.rooms[currentRoomId];
        if (room && room.hostId === currentUser.id) {
            room.status = 'playing';
            await saveSpecificData('rooms/' + currentRoomId, room);
            fetchSystemData();
        }
    }

    function renderRoomOrGameView() {
        let room = globalData.rooms[currentRoomId];
        if (!room) return switchView('view-lobby');

        if (room.status === 'waiting') {
            switchView('view-room');
            document.getElementById('display-room-id').innerText = room.id;
            let blueList = document.getElementById('room-list-blue');
            let redList = document.getElementById('room-list-red');
            blueList.innerHTML = ''; redList.innerHTML = '';

            for (let pId in room.players) {
                let li = document.createElement('li');
                li.className = 'user-item';
                li.innerText = pId;
                if (room.players[pId].team === 'blue') blueList.appendChild(li);
                else redList.appendChild(li);
            }

            let hostControls = document.getElementById('room-host-controls');
            if (room.hostId === currentUser.id) hostControls.classList.remove('hidden');
            else hostControls.classList.add('hidden');
        } else {
            switchView('view-game');
            let boardEl = document.getElementById('othello-board');
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    let discColor = room.board[r][c];
                    if (discColor) {
                        let disc = document.createElement('div');
                        disc.className = `disc ${discColor}`;
                        cell.appendChild(disc);
                    }
                    boardEl.appendChild(cell);
                }
            }
        }
    }

    function renderLobbyView() {
        // 랭킹 렌더링 (단수 표시 복구)
        let rankingEl = document.getElementById('ranking-list');
        let usersArr = Object.values(globalData.users || {});
        usersArr.sort((a, b) => (b.score || 0) - (a.score || 0));
        
        rankingEl.innerHTML = '';
        usersArr.forEach((u, index) => {
            let div = document.createElement('div');
            div.className = 'rank-item';
            let rankTitle = (u.id === ADMIN_ID) ? '마스터 (관리자)' : `${Math.max(1, Math.floor((u.score || 0) / 100) + 1)}단`;
            if (u.id === ADMIN_ID) div.classList.add('rank-admin');
            div.innerHTML = `<span>${index + 1}. ${u.id}</span> <span>${rankTitle} (${u.score || 0}점)</span>`;
            rankingEl.appendChild(div);
        });

        // 방 목록 렌더링
        let roomListBox = document.getElementById('room-list-box');
        roomListBox.innerHTML = '';
        let rooms = globalData.rooms || {};
        
        if (Object.keys(rooms).length === 0) {
            roomListBox.innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">개설된 방이 없습니다.</div>`;
        } else {
            for (let rId in rooms) {
                let room = rooms[rId];
                if (!room) continue;
                let div = document.createElement('div');
                div.className = 'room-item';
                div.innerHTML = `
                    <div><strong>${room.id || rId}</strong> <span style="font-size:11px; color:#aaa;">(${room.status === 'waiting' ? '대기중' : '진행중'})</span></div>
                    <button class="btn-blue" style="width:auto; padding:4px 8px; font-size:11px;" onclick="joinRoom('${rId}')">${room.status === 'waiting' ? '참가' : '관전'}</button>
                `;
                roomListBox.appendChild(div);
            }
        }

        let onlineListEl = document.getElementById('online-user-list');
        onlineListEl.innerHTML = '';
        let users = globalData.users || {};
        document.getElementById('online-count').innerText = Object.keys(users).length;
        for (let uId in users) {
            let li = document.createElement('li');
            li.className = 'user-item';
            li.innerHTML = `<span>${uId}</span>`;
            onlineListEl.appendChild(li);
        }
    }

    async function sendLobbyChat() {
        let input = document.getElementById('lobby-chat-input');
        let text = input.value.trim();
        if (!text) return;
        globalData.lobbyChat.push({ sender: currentUser.id, text: text });
        await saveSpecificData('lobbyChat', globalData.lobbyChat);
        input.value = '';
        renderLobbyChat();
    }

    function renderLobbyChat() {
        let chatMsgsEl = document.getElementById('lobby-chat-msgs');
        chatMsgsEl.innerHTML = '';
        (globalData.lobbyChat || []).forEach(msg => {
            let li = document.createElement('li');
            li.className = 'chat-msg';
            li.innerHTML = `<span class="sender">${msg.sender}:</span> ${msg.text}`;
            chatMsgsEl.appendChild(li);
        });
        chatMsgsEl.scrollTop = chatMsgsEl.scrollHeight;
    }
</script>
</body>
</html>
